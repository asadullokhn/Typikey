name: Typikey
options:
  bundleIdPrefix: com.asadullokh.ch5
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: Y7ZZ5G2T3Y
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"
    CURRENT_PROJECT_VERSION: 56
    MARKETING_VERSION: "1.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Typikey:
    type: application
    platform: iOS
    sources: [App, Shared, Keyboard/CompletionEngine.swift]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Typikey
        NSCalendarsFullAccessUsageDescription: Typikey can use selected upcoming event titles to improve on-device keyboard suggestions.
        NSLocationWhenInUseUsageDescription: Typikey can use a coarse current place label to improve on-device keyboard suggestions.
        # TestFlight: answers the export-compliance question at upload time.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Renamed together with the product (2026-08-05, pre-release —
        # the last moment this is cheap): the App Store record fixes the
        # bundle id forever, so it should carry the real name.
        PRODUCT_BUNDLE_IDENTIFIER: com.asadullokh.ch5.typikey
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app's tint is the keyboard's Palette.action, declared rather
        # than coincidentally matching the system blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: App/Typikey.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.asadullokh.ch5.typikey
    dependencies:
      - target: TypikeyKeyboard
        embed: true
      - target: TypikeyBroadcast
        embed: true
      - target: TypikeyShare
        embed: true
  TypikeyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Typikey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asadullokh.ch5.typikey.uitests
        TEST_TARGET_NAME: Typikey
  TypikeyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Typikey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asadullokh.ch5.typikey.tests
        GENERATE_INFOPLIST_FILE: YES
  TypikeyKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Typikey
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asadullokh.ch5.typikey.keyboard
    entitlements:
      path: Keyboard/TypikeyKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.asadullokh.ch5.typikey
  TypikeyShare:
    type: app-extension
    platform: iOS
    sources: [Share, Shared]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Typikey
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asadullokh.ch5.typikey.share
    entitlements:
      path: Share/TypikeyShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.asadullokh.ch5.typikey
  TypikeyBroadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Typikey
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          # RPBroadcastProcessMode appears BOTH nested and as a direct
          # child: Xcode's template nests it under NSExtensionAttributes,
          # but App Store Connect's binary validator has been reported
          # (devforums 804699) to want it directly under NSExtension.
          # Both placements are harmless; either satisfies its reader.
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asadullokh.ch5.typikey.broadcast
    entitlements:
      path: Broadcast/TypikeyBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.asadullokh.ch5.typikey
schemes:
  Typikey:
    build:
      targets:
        Typikey: all
        TypikeyUITests: [test]
    test:
      targets:
        - TypikeyTests
        - TypikeyUITests
